# Self-host everything on one machine: `docker compose up`, then open
# http://localhost:3000. Migrations run on every start (no-op when current).
services:
  postgres:
    image: postgres:16
    container_name: finance-aggregator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      # Host 5433 -> container 5432, for `npm run dev` on the host and to avoid
      # clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: finance-aggregator-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Compose-network hostname overrides the localhost value in .env.
      DATABASE_URL: postgres://finance:finance@postgres:5432/finance
    command: sh -c "npm run db:migrate && npm start"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
